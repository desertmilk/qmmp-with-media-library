name: Release Build

on:
  # schedule:
    # # Run daily at 03:00 UTC
    # - cron: '0 3 * * *'
  #
  # TODO: trigger build on new commit
  #
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even without new commits'
        required: false
        default: false
        type: boolean

# Never stack nightly builds: a newer run cancels a still-running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs use read-only access by default; the release job grants write access below.
permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release

jobs:
  
  # Job 1: Check if there are new commits since the last build
  
  check-for-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      last_sha: ${{ steps.check.outputs.last_sha }}
      should_build: ${{ steps.check.outputs.should_build }}
      commit_sha: ${{ steps.check.outputs.commit_sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      build_date: ${{ steps.check.outputs.build_date }}
      commit_message: ${{ steps.check.outputs.commit_message }}
      commit_author: ${{ steps.check.outputs.commit_author }}
      commit_date: ${{ steps.check.outputs.commit_date }}
      commits_count: ${{ steps.check.outputs.commits_count }}
    steps:
      - name: Check for new commits
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          BRANCH="${REF#refs/heads/}"
          BUILD_DATE=$(date -u +'%Y-%m-%d')

          JSON=$(gh api "repos/$REPO/commits/$BRANCH")
          CURRENT_SHA=$(jq -r '.sha' <<<"$JSON")
          SHORT_SHA="${CURRENT_SHA:0:8}"
          COMMIT_MESSAGE=$(jq -r '.commit.message | split("\n")[0]' <<<"$JSON")
          COMMIT_AUTHOR=$(jq -r '"\(.commit.author.name) <\(.commit.author.email)>"' <<<"$JSON")
          COMMIT_DATE=$(jq -r '.commit.author.date' <<<"$JSON")

          LAST_NIGHTLY_SHA=$(gh api "repos/$REPO/commits/nightly" --jq '.sha' 2>/dev/null || true)
          if [ -z "$LAST_NIGHTLY_SHA" ]; then
            LAST_NIGHTLY_SHA=$(gh release view nightly --repo "$REPO" --json body -q .body 2>/dev/null \
              | grep -oP 'Commit SHA: \K[a-f0-9]{40}' || true)
          fi
          if [ -n "${LAST_NIGHTLY_SHA}" ]; then
            COMMITS_COUNT=$(gh api "repos/$REPO/compare/${LAST_NIGHTLY_SHA}...${CURRENT_SHA}" \
              --jq '.total_commits' 2>/dev/null || echo "unknown")
          else
            COMMITS_COUNT="N/A (first nightly)"
          fi
          
          # Determine if we should build
          if [ "${FORCE_BUILD}" = "true" ]; then
            SHOULD_BUILD="true"
            REASON="Manual force build triggered"
          elif [ -z "${LAST_NIGHTLY_SHA}" ]; then
            SHOULD_BUILD="true"
            REASON="First nightly build (no previous release found)"
          elif [ "${CURRENT_SHA}" != "${LAST_NIGHTLY_SHA}" ]; then
            SHOULD_BUILD="true"
            REASON="New commits detected (${COMMITS_COUNT} commit(s) since last build)"
          else
            SHOULD_BUILD="false"
            REASON="No new commits since last build"
          fi
          
          # Set outputs
          echo "should_build=${SHOULD_BUILD}" >> $GITHUB_OUTPUT
          echo "last_sha=${LAST_NIGHTLY_SHA}" >> $GITHUB_OUTPUT
          echo "commit_sha=${CURRENT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "commit_message=${COMMIT_MESSAGE}" >> $GITHUB_OUTPUT
          echo "commit_author=${COMMIT_AUTHOR}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
          echo "commits_count=${COMMITS_COUNT}" >> $GITHUB_OUTPUT
          
          echo "========================================"
          echo "Nightly Build Check Results"
          echo "========================================"
          echo "Should Build: ${SHOULD_BUILD}"
          echo "Reason: ${REASON}"
          echo "Current SHA: ${CURRENT_SHA}"
          echo "Last Nightly SHA: ${LAST_NIGHTLY_SHA:-None}"
          echo "Commits Since Last: ${COMMITS_COUNT}"
          echo "========================================"
  
  # Job 2: Build on Linux (Ubuntu) - Binary Tarball
  
  build-linux-binary:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check-for-updates.outputs.build_date }}-${{ needs.check-for-updates.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-for-updates.outputs.commit_sha }}
          fetch-depth: 1
          path: qmmp-src

      - name: Install required dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            pkg-config \
            tar \
            unzip \
            bzip2 \
            gzip \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libgl1-mesa-dev \
            libmad0-dev \
            libmpg123-dev \
            libflac-dev \
            libfaad-dev \
            libvorbis-dev \
            libogg-dev \
            libasound2-dev \
            libtag1-dev \
            libcurl4-openssl-dev

      - name: Install optional dependencies
        run: |
          sudo apt-get install -y \
            qtmultimedia6-dev \
            libmpcdec-dev \
            libjack-jackd2-dev \
            libsoxr-dev \
            libxmp-dev \
            libsndfile1-dev \
            libwavpack-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libcdio-dev \
            libcdio-paranoia-dev \
            libcddb2-dev \
            libgme-dev \
            libopus-dev \
            libopusfile-dev \
            libwildmidi-dev \
            libsidplayfp-dev \
            libbs2b-dev \
            libprojectm-dev \
            libenca-dev \
            libarchive-dev \
            libshout3-dev \
            libx11-dev \
            libxcb1-dev \
            x11proto-dev \
            librcd0-dev \
            libmms-dev || true

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-binary-${{ github.run_id }}
          restore-keys: ccache-linux-binary-

      - name: Configure with CMake
        run: |
          mkdir -p qmmp-src/qmmp/build && cd qmmp-src/qmmp/build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSE_QTMULTIMEDIA=TRUE \
            -DUSE_PIPEWIRE=TRUE \
            -DUSE_PROJECTM=TRUE \
            -DUSE_LIBCDDB=TRUE \
            -DUSE_FLAC=TRUE \
            -DUSE_AAC=TRUE \
            -DQMMP_DEFAULT_UI=qsui

      - name: Build
        run: |
          cd qmmp-src/qmmp/build
          ninja -j$(nproc)

      - name: Install to staging directory
        run: |
          cd qmmp-src/qmmp/build
          DESTDIR=${{ github.workspace }}/staging-binary ninja install

      - name: Create binary tarball
        run: |
          cd ${{ github.workspace }}
          tar -czf qmmp-${VERSION}-linux-x86_64-binary.tar.gz -C staging-binary .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmmp-linux-binary
          path: qmmp-*-linux-x86_64-binary.tar.gz
          retention-days: 7
          if-no-files-found: error

  
  # Job 3: Build on Linux (Ubuntu) - AppImage
  
  build-linux-appimage:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check-for-updates.outputs.build_date }}-${{ needs.check-for-updates.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-for-updates.outputs.commit_sha }}
          fetch-depth: 1
          path: qmmp-src

      - name: Install required dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            pkg-config \
            tar \
            unzip \
            bzip2 \
            gzip \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libgl1-mesa-dev \
            libmad0-dev \
            libmpg123-dev \
            libflac-dev \
            libfaad-dev \
            libvorbis-dev \
            libogg-dev \
            libasound2-dev \
            libtag1-dev \
            libcurl4-openssl-dev \
            file \
            fuse \
            patchelf

      - name: Install optional dependencies
        run: |
          sudo apt-get install -y \
            qtmultimedia6-dev \
            libmpcdec-dev \
            libjack-jackd2-dev \
            libsoxr-dev \
            libxmp-dev \
            libsndfile1-dev \
            libwavpack-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libcdio-dev \
            libcdio-paranoia-dev \
            libcddb2-dev \
            libgme-dev \
            libopus-dev \
            libopusfile-dev \
            libwildmidi-dev \
            libsidplayfp-dev \
            libbs2b-dev \
            libprojectm-dev \
            libenca-dev \
            libarchive-dev \
            libshout3-dev \
            libx11-dev \
            libxcb1-dev \
            x11proto-dev \
            librcd0-dev \
            libmms-dev \
            libgl1-mesa-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev || true

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-appimage-${{ github.run_id }}
          restore-keys: ccache-linux-appimage-

      - name: Configure with CMake for AppImage
        run: |
          pkg-config --modversion taglib libmpg123 flac faad2
          mkdir -p qmmp-src/qmmp/build && cd qmmp-src/qmmp/build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSE_QTMULTIMEDIA=TRUE \
            -DUSE_PIPEWIRE=TRUE \
            -DUSE_PROJECTM=TRUE \
            -DUSE_LIBCDDB=TRUE \
            -DUSE_MAD=TRUE \
            -DUSE_MPG123=TRUE \
            -DUSE_FLAC=TRUE \
            -DUSE_AAC=TRUE \
            -DQMMP_DEFAULT_UI=skinned \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=FALSE \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib:$ORIGIN/../..'

      - name: Build
        run: |
          cd qmmp-src/qmmp/build
          ninja -j$(nproc)

      - name: Install to AppDir
        run: |
          mkdir -p ${{ github.workspace }}/AppDir
          cd qmmp-src/qmmp/build
          DESTDIR=${{ github.workspace }}/AppDir ninja install
          MPEG_PLUGIN=$(find ${{ github.workspace }}/AppDir/usr -type f,l -name 'libmpeg.so' -print -quit)
          VORBIS_PLUGIN=$(find ${{ github.workspace }}/AppDir/usr -type f,l -name 'libvorbis.so' -print -quit)
          FLAC_PLUGIN=$(find ${{ github.workspace }}/AppDir/usr -type f,l -name 'libflac.so' -print -quit)
          AAC_PLUGIN=$(find ${{ github.workspace }}/AppDir/usr -type f,l -name 'libaac.so' -print -quit)
          test -n "$MPEG_PLUGIN"
          test -n "$VORBIS_PLUGIN"
          test -n "$FLAC_PLUGIN"
          test -n "$AAC_PLUGIN"
          find ${{ github.workspace }}/AppDir/usr -type f -name '*.so*' -exec \
            patchelf --set-rpath '$ORIGIN/../lib:$ORIGIN/../..' {} +
          patchelf --set-rpath '$ORIGIN/../lib' ${{ github.workspace }}/AppDir/usr/bin/qmmp
          ldd "$MPEG_PLUGIN"
          ! ldd "$MPEG_PLUGIN" | grep -q 'not found'
          ldd "$VORBIS_PLUGIN"
          ! ldd "$VORBIS_PLUGIN" | grep -q 'not found'
          ldd "$FLAC_PLUGIN"
          ! ldd "$FLAC_PLUGIN" | grep -q 'not found'
          ldd "$AAC_PLUGIN"
          ! ldd "$AAC_PLUGIN" | grep -q 'not found'

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          
          # Use a statically linked runtime so the produced AppImage does not require libfuse.so.2 on the target system.
          wget -q https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x runtime-x86_64

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppImage
        run: |
          # Create desktop file
          cat > ${{ github.workspace }}/AppDir/usr/share/applications/qmmp.desktop << 'EOF'
          [Desktop Entry]
          Name=Qmmp
          Comment=Qt-based Multimedia Player
          Exec=qmmp --ui skinned %F
          Icon=qmmp
          Type=Application
          Categories=AudioVideo;Audio;Player;
          MimeType=audio/x-mpegurl;audio/mpeg;audio/x-mp3;audio/flac;audio/ogg;audio/x-vorbis+ogg;audio/x-wav;
          Terminal=false
          StartupNotify=true
          EOF
          
          # Copy desktop file to AppDir root
          cp ${{ github.workspace }}/AppDir/usr/share/applications/qmmp.desktop ${{ github.workspace }}/AppDir/
          
          # Find and copy icon
          if [ -f ${{ github.workspace }}/AppDir/usr/share/icons/hicolor/128x128/apps/qmmp.png ]; then
            cp ${{ github.workspace }}/AppDir/usr/share/icons/hicolor/128x128/apps/qmmp.png ${{ github.workspace }}/AppDir/qmmp.png
          elif [ -f ${{ github.workspace }}/AppDir/usr/share/pixmaps/qmmp.png ]; then
            cp ${{ github.workspace }}/AppDir/usr/share/pixmaps/qmmp.png ${{ github.workspace }}/AppDir/qmmp.png
          else
            # Find any qmmp icon
            ICON=$(find ${{ github.workspace }}/AppDir -name "qmmp.png" 2>/dev/null | head -1)
            if [ -n "$ICON" ]; then
              cp "$ICON" ${{ github.workspace }}/AppDir/qmmp.png
            fi
          fi
          
          # Set QT_PLUGIN_PATH for linuxdeploy
          export QT_PLUGIN_PATH=/usr/lib/qt6/plugins
          export EXTRA_QT_MODULES="multimedia,multimediawidgets"
          export DEPLOY_GSTREAMER_PLUGINS="1"
          QMMP_LIB=$(find ${{ github.workspace }}/AppDir/usr -type f,l -name 'libqmmp.so.2' -print -quit)
          QMMPUI_LIB=$(find ${{ github.workspace }}/AppDir/usr -type f,l -name 'libqmmpui.so.2' -print -quit)
          test -n "$QMMP_LIB"
          test -n "$QMMPUI_LIB"
          PLUGIN_LIBS=()
          while IFS= read -r plugin; do
            PLUGIN_LIBS+=(--library "$plugin")
          done < <(find ${{ github.workspace }}/AppDir/usr -type f,l -name '*.so' -print)
          test "${#PLUGIN_LIBS[@]}" -gt 0
          printf 'Qmmp libraries: %s %s; plugin roots: %s\n' "$QMMP_LIB" "$QMMPUI_LIB" "$(( ${#PLUGIN_LIBS[@]} / 2 ))"
          QMMP_LIB_DIR=$(dirname "$QMMP_LIB")
          QMMPUI_LIB_DIR=$(dirname "$QMMPUI_LIB")
          export LD_LIBRARY_PATH="$QMMP_LIB_DIR:$QMMPUI_LIB_DIR:${LD_LIBRARY_PATH:-}"
          
          # Deploy dependencies and plugins into AppDir. AppImage creation is done separately below so the custom runtime is always selected.
          ./linuxdeploy-x86_64.AppImage \
            --appdir ${{ github.workspace }}/AppDir \
            --plugin qt \
            --library "$QMMP_LIB" \
            --library "$QMMPUI_LIB" \
            "${PLUGIN_LIBS[@]}" \
            -e ${{ github.workspace }}/AppDir/usr/bin/qmmp \
            -d ${{ github.workspace }}/AppDir/qmmp.desktop \
            -i ${{ github.workspace }}/AppDir/qmmp.png \
            -v2

          test -n "$(find ${{ github.workspace }}/AppDir -type f,l -name 'libmpeg.so' -print -quit)"
          test -n "$(find ${{ github.workspace }}/AppDir -type f,l -name 'libvorbis.so' -print -quit)"
          test -n "$(find ${{ github.workspace }}/AppDir -type f,l -name 'libflac.so' -print -quit)"
          test -n "$(find ${{ github.workspace }}/AppDir -type f,l -name 'libaac.so' -print -quit)"
          test -n "$(find ${{ github.workspace }}/AppDir -type f,l -name 'libQt6Sql.so.6' -print -quit)"

          # Create the final AppImage with a FUSE 2-independent runtime.
          ./appimagetool-x86_64.AppImage --no-appstream \
            --runtime-file ${{ github.workspace }}/runtime-x86_64 \
            ${{ github.workspace }}/AppDir \
            ${{ github.workspace }}/qmmp-${VERSION}-linux-x86_64.AppImage

          test -s ${{ github.workspace }}/qmmp-${VERSION}-linux-x86_64.AppImage
          runtime_version=$(./runtime-x86_64 --appimage-version)
          appimage_version=$(./qmmp-${VERSION}-linux-x86_64.AppImage --appimage-version)
          test "$runtime_version" = "$appimage_version"
        env:
          QMAKE: /usr/lib/qt6/bin/qmake

      - name: List AppDir contents for debugging
        if: always()
        run: |
          echo "=== AppDir Structure ==="
          find ${{ github.workspace }}/AppDir -type f 2>/dev/null | head -50
          echo "=== AppImage Files ==="
          ls -la *.AppImage 2>/dev/null || echo "No AppImage files found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmmp-linux-appimage
          path: qmmp-*-linux-x86_64.AppImage
          retention-days: 7
          if-no-files-found: error

  
  # Job 4: Build on macOS

  build-macos:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.should_build == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      VERSION: ${{ needs.check-for-updates.outputs.build_date }}-${{ needs.check-for-updates.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-for-updates.outputs.commit_sha }}
          fetch-depth: 1
          path: qmmp-src
 
      - name: Install Homebrew dependencies
        run: |
          brew update
          
          # Required dependencies
          brew install cmake ninja ccache qt@6 libmad libvorbis libogg taglib libiconv curl
          
          # Optional dependencies (install what's available)
          brew install \
            mpg123 \
            flac \
            jack \
            libsoxr \
            libxmp \
            libsndfile \
            wavpack \
            ffmpeg \
            libcdio \
            libcddb \
            faad2 \
            game-music-emu \
            opus \
            opusfile \
            wildmidi \
            libsidplayfp \
            libbs2b \
            projectm \
            libarchive \
            libshout \
            enca \
            pkg-config || true
 
      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ github.run_id }}
          restore-keys: ccache-macos-
 
      - name: Configure with CMake
        run: |
          mkdir -p qmmp-src/qmmp/build && cd qmmp-src/qmmp/build
          export LDFLAGS="-L$(brew --prefix qt@6)/lib -L$(brew --prefix libiconv)/lib -L$(brew --prefix libogg)/lib -L$(brew --prefix libvorbis)/lib"
          export CPPFLAGS="-I$(brew --prefix qt@6)/include -I$(brew --prefix libiconv)/include -I$(brew --prefix libogg)/include -I$(brew --prefix libvorbis)/include -I$(brew --prefix opusfile)/include"
          export PKG_CONFIG_PATH="$(brew --prefix qt@6)/lib/pkgconfig:$(brew --prefix libiconv)/lib/pkgconfig:$(brew --prefix libogg)/lib/pkgconfig:$(brew --prefix libvorbis)/lib/pkgconfig"
          # NOTE: CMAKE_OSX_DEPLOYMENT_TARGET only affects Qmmp's own code. Homebrew bottles (Qt, ffmpeg, ...) are built for the runner's macOS version, so the real minimum version of the bundle is computed later from the bundled binaries.
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSE_ALSA=FALSE \
            -DUSE_OSS=FALSE \
            -DUSE_OSS4=FALSE \
            -DUSE_PULSE=FALSE \
            -DUSE_PIPEWIRE=FALSE \
            -DUSE_JACK=FALSE \
            -DUSE_QTMULTIMEDIA=TRUE \
            -DUSE_PROJECTM=TRUE \
            -DUSE_LIBCDDB=TRUE \
            -DQMMP_DEFAULT_UI=qsui \
            -DCMAKE_CXX_FLAGS="-I$(brew --prefix libbs2b)/include -I$(brew --prefix opusfile)/include -I$(brew --prefix opus)/include" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-needed_library,$(brew --prefix libiconv)/lib/libiconv.dylib"
      - name: Build
        run: |
          cd qmmp-src/qmmp/build
          ninja -j$(sysctl -n hw.ncpu)
 
      - name: Install to staging directory
        run: |
          cd qmmp-src/qmmp/build
          DESTDIR=${{ github.workspace }}/staging-macos ninja install
 
      # - name: Create tarball
      #   run: |
      #     cd ${{ github.workspace }}
      #     tar -czf qmmp-${VERSION}-macos-arm64.tar.gz -C staging-macos .
 
      - name: Create and sign macOS app bundle
        run: |
          APP_BUNDLE=${{ github.workspace }}/Qmmp.app
          CONTENTS="$APP_BUNDLE/Contents"
          STAGING=${{ github.workspace }}/staging-macos
 
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources" "$CONTENTS/lib" "$CONTENTS/share"
          cp "$STAGING/usr/local/bin/qmmp" "$CONTENTS/MacOS/qmmp"
          chmod +x "$CONTENTS/MacOS/qmmp"
 
          if [ -d "$STAGING/usr/local/lib" ]; then
            cp -R "$STAGING/usr/local/lib/." "$CONTENTS/lib/"
          fi
          if [ -d "$STAGING/usr/local/share/qmmp" ]; then
            cp -R "$STAGING/usr/local/share/qmmp" "$CONTENTS/share/"
          fi
 
          # LSMinimumSystemVersion is a placeholder here; it is replaced below with the highest minimum OS version found among the bundled binaries. CFBundleVersion must be numeric, so use the run number (the short SHA is hex).
          cat > "$CONTENTS/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleDisplayName</key>
              <string>Qmmp</string>
              <key>CFBundleExecutable</key>
              <string>qmmp</string>
              <key>CFBundleIdentifier</key>
              <string>com.ylsoftware.qmmp</string>
              <key>CFBundleName</key>
              <string>Qmmp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ needs.check-for-updates.outputs.build_date }}</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
 
          # macdeployqt only fixes up the main executable and Qt plugins by itself. Qmmp's own plugins/libraries were copied into Contents/lib, so pass them explicitly; otherwise they keep pointing at the runner's Homebrew paths.
          MACDEPLOYQT="$(brew --prefix qt@6)/bin/macdeployqt"
          test -x "$MACDEPLOYQT"
          export PATH="$(brew --prefix qt@6)/bin:$PATH"
          EXEC_ARGS=()
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              EXEC_ARGS+=("-executable=$f")
            fi
          done < <(find "$CONTENTS/lib" -type f -print0)
          # -libpath lets macdeployqt resolve @rpath/libqmmp*.2.dylib (which live in Contents/lib) instead of only searching /opt/homebrew/lib; it then copies them into Contents/Frameworks and rewrites the plugins' references.
          "$MACDEPLOYQT" "$APP_BUNDLE" -always-overwrite -libpath="$CONTENTS/lib" \
            ${EXEC_ARGS[@]+"${EXEC_ARGS[@]}"}
 
          file "$APP_BUNDLE/Contents/MacOS/qmmp"
          [[ "$(file -b "$CONTENTS/MacOS/qmmp")" == *arm64* ]]
 
          # Fail if any bundled binary still references the runner's Homebrew install; such a bundle works on CI and crashes on every user's Mac.
          BAD=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              if otool -L "$f" | tail -n +2 | grep -Eq '/opt/homebrew|/usr/local/(Cellar|opt|lib)'; then
                echo "::error::External dependency in ${f#$APP_BUNDLE/}"
                otool -L "$f" | grep -E '/opt/homebrew|/usr/local/' || true
                BAD=1
              fi
            fi
          done < <(find "$APP_BUNDLE" -type f -print0)
          [ "$BAD" -eq 0 ]
 
          # Compute the real minimum macOS version: the highest minos among all bundled
          # Mach-O files (Homebrew bottles are built for the runner's macOS version).
          MINOS=$(
            while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q 'Mach-O'; then
                otool -l "$f" | awk '
                  /^ *cmd LC_BUILD_VERSION/ {b=1; next}
                  /^ *cmd LC_VERSION_MIN_MACOSX/ {v=1; next}
                  b && /^ *minos / {print $2; b=0}
                  v && /^ *version / {print $2; v=0}'
              fi
            done < <(find "$APP_BUNDLE" -type f -print0) | sort -V | tail -n 1
          )
          echo "Highest minimum macOS version in bundle: ${MINOS:-unknown}"
          if [ -n "$MINOS" ]; then
            plutil -replace LSMinimumSystemVersion -string "$MINOS" "$CONTENTS/Info.plist"
          fi
          plutil -lint "$CONTENTS/Info.plist"
 
          # Ad-hoc signing allows the downloaded nightly app to launch locally.
          # It is not a Developer ID signature and does not provide notarization.
          # Sign inside-out: every Mach-O first (--deep does not reach Contents/lib), then frameworks, then the app itself. Hardened runtime (--options runtime) is intentionally NOT used: its library validation rejects ad-hoc-signed plugins.
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --force --sign - "$f"
            fi
          done < <(find "$APP_BUNDLE" -type f ! -path '*/Contents/MacOS/qmmp' -print0)
          while IFS= read -r -d '' fw; do
            codesign --force --sign - "$fw"
          done < <(find "$APP_BUNDLE" -name '*.framework' -type d -print0)
          codesign --force --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
 
          # Smoke test: catches dyld/plugin loading failures before we ship. (Adjust the flag if Qmmp's CLI differs.)
          QT_QPA_PLATFORM=offscreen "$CONTENTS/MacOS/qmmp" --help
 
          # DMG generation is intentionally disabled for these nightly builds.
          # mv Qmmp.dmg qmmp-${VERSION}-macos-arm64.dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" \
            qmmp-${VERSION}-macos-arm64.app.zip
          # test -s qmmp-${VERSION}-macos-arm64.dmg
          test -s qmmp-${VERSION}-macos-arm64.app.zip
 
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmmp-macos
          path: |
            qmmp-*-macos-arm64.app.zip
          retention-days: 7
          if-no-files-found: error

  
  # Job 5: Build on Windows (MSYS2/UCRT64)
  build-windows:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.check-for-updates.outputs.build_date }}-${{ needs.check-for-updates.outputs.short_sha }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-for-updates.outputs.commit_sha }}
          fetch-depth: 1
          path: qmmp-src

      - name: Setup MSYS2 with UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-libmad
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-mpg123
            mingw-w64-ucrt-x86_64-flac
            mingw-w64-ucrt-x86_64-libmpcdec
            mingw-w64-ucrt-x86_64-jack2
            mingw-w64-ucrt-x86_64-libsoxr
            mingw-w64-ucrt-x86_64-libxmp
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-wavpack
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libcdio
            mingw-w64-ucrt-x86_64-libcddb
            mingw-w64-ucrt-x86_64-faad2
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libsidplayfp
            mingw-w64-ucrt-x86_64-libbs2b
            mingw-w64-ucrt-x86_64-libprojectm
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-libshout
            mingw-w64-ucrt-x86_64-7zip

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-windows-${{ github.run_id }}
          restore-keys: ccache-windows-

      - name: Configure with CMake
        run: |
          mkdir -p qmmp-src/qmmp/build && cd qmmp-src/qmmp/build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DUSE_ALSA=FALSE \
            -DUSE_OSS=FALSE \
            -DUSE_OSS4=FALSE \
            -DUSE_PULSE=FALSE \
            -DUSE_PIPEWIRE=FALSE \
            -DUSE_JACK=FALSE \
            -DUSE_NULL=TRUE \
            -DUSE_WAVEOUT=TRUE \
            -DUSE_DSOUND=TRUE \
            -DUSE_WASAPI=TRUE \
            -DUSE_QTMULTIMEDIA=TRUE \
            -DUSE_PROJECTM=TRUE \
            -DUSE_LIBCDDB=TRUE \
            -DQMMP_DEFAULT_UI=qsui \
            -DQMMP_DEFAULT_OUTPUT=wasapi \
            -DICONV_LIBRARY:FILEPATH="$MINGW_PREFIX/lib/libiconv.dll.a"

      - name: Build
        run: |
          cd qmmp-src/qmmp/build
          ninja -j$(nproc)

      # --prefix installs straight into the staging directory, so the layout is staging-windows/bin, staging-windows/lib, ... instead of a mangled DESTDIR + "C:/msys64/ucrt64" path.
      - name: Install to staging directory
        run: |
          cmake --install qmmp-src/qmmp/build --prefix "$PWD/staging-windows"
          test -f staging-windows/bin/qmmp.exe

      # Step 1: let windeployqt deploy the Qt DLLs and Qt plugins (platforms/qwindows.dll, styles, imageformats, multimedia, tls, ...). Qmmp's own DLLs and plugins are passed as extra binaries so windeployqt also sees the Qt modules they use (e.g. Multimedia).
      # Step 2: copy every remaining non-system dependency from the MSYS2 prefix next to qmmp.exe (Windows searches the application directory when loading plugin DLLs).
      - name: Bundle runtime dependencies
        run: |
          STAGING="$PWD/staging-windows"
          export PATH="$STAGING/bin:$PATH"

          WINDEPLOYQT=$(command -v windeployqt6 || command -v windeployqt-qt6 || command -v windeployqt)
          test -n "$WINDEPLOYQT"

          QMMP_BINARIES=()
          while IFS= read -r -d '' f; do
            QMMP_BINARIES+=("$f")
          done < <(find "$STAGING" -type f -name '*.dll' -print0)

          "$WINDEPLOYQT" --release --no-translations --no-opengl-sw \
            --no-system-d3d-compiler --no-compiler-runtime \
            --dir "$STAGING/bin" \
            "$STAGING/bin/qmmp.exe" "${QMMP_BINARIES[@]}"

          # Copy dependencies until a fixed point is reached (copied DLLs have deps too).
          for pass in 1 2 3 4 5 6; do
            COPIED=0
            while IFS= read -r dep; do
              if [ ! -e "$STAGING/bin/$(basename "$dep")" ]; then
                cp -v "$dep" "$STAGING/bin/"
                COPIED=1
              fi
            done < <(
              find "$STAGING" -type f \( -name '*.exe' -o -name '*.dll' \) -print0 \
                | xargs -0 -n 20 ldd 2>/dev/null \
                | awk -v p="$MINGW_PREFIX/" 'index($3, p) == 1 {print $3}' \
                | sort -u
            )
            if [ "$COPIED" -eq 0 ]; then
              break
            fi
          done

      # Resolves every exe/DLL with a PATH that contains only the bundle and Windows itself. Anything still pointing into the MSYS2 prefix (or unresolved) fails the build.
      - name: Verify bundle is self-contained
        run: |
          STAGING="$PWD/staging-windows"
          test -f "$STAGING/bin/platforms/qwindows.dll"

          export PATH="$STAGING/bin:/usr/bin:/c/Windows/System32:/c/Windows"
          BAD=0
          while IFS= read -r -d '' f; do
            OUT=$(ldd "$f" 2>/dev/null || true)
            # api-ms-win-* / ext-ms-win-* are virtual DLLs resolved by Windows itself.
            NOTFOUND=$(grep 'not found' <<<"$OUT" | grep -Ev '^\s*(api|ext)-ms-' || true)
            LEAK=$(awk '$2 == "=>" {print $3}' <<<"$OUT" | grep -E '^/(ucrt64|mingw64|mingw32|clang64|usr)/' || true)
            if [ -n "$NOTFOUND" ] || [ -n "$LEAK" ]; then
              echo "::error::Unresolved or external dependency in ${f#$STAGING/}"
              echo "$NOTFOUND"
              echo "$LEAK"
              BAD=1
            fi
          done < <(find "$STAGING" -type f \( -name '*.exe' -o -name '*.dll' \) -print0)
          [ "$BAD" -eq 0 ]

      - name: List bundle contents for debugging
        if: always()
        run: |
          echo "=== Bundle top level ==="
          ls -la staging-windows staging-windows/bin 2>/dev/null | head -100 || true
          echo "=== Total size ==="
          du -sh staging-windows 2>/dev/null || true

      - name: Create 7z archive
        run: |
          7z a -mx=9 qmmp-${VERSION}-windows-x86_64.7z ./staging-windows/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmmp-windows
          path: qmmp-*.7z
          retention-days: 7
          if-no-files-found: error

  
  # Job 6: Create GitHub Release with all artifacts
  
  create-release:
    needs:
      - check-for-updates
      - build-linux-binary
      - build-linux-appimage
      - build-macos
      - build-windows
    if: needs.check-for-updates.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-for-updates.outputs.commit_sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.7z" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.zip" \) | sort
          echo "============================"

      - name: Get recent changes
        id: changes
        run: |
          # Get changes since last nightly if exists
          LAST_SHA=""
          if gh release view nightly --json body -q '.body' >/dev/null 2>&1; then
            LAST_SHA=$(gh release view nightly --json body -q '.body' | grep -oP 'Commit SHA: \K[a-f0-9]{40}' || echo "")
          fi
          
          {
            echo "changes_content<<CHANGEEOF"
            if [ -n "${LAST_SHA}" ]; then
              echo "## 📝 Recent Changes"
              echo ""
              git log "${LAST_SHA}..HEAD" --pretty=format:"- %s (%h)" --no-merges || echo "- Unable to retrieve changes"
              echo ""
            else
              echo "## 📝 Recent Changes"
              echo ""
              echo "First nightly build - showing last 15 commits:"
              echo ""
              git log -15 --pretty=format:"- %s (%h)" --no-merges || echo "- Unable to retrieve changes"
              echo ""
            fi
            echo "CHANGEEOF"
          } >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing nightly release
        run: |
          gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        run: |
          # Collect all archive files
          ARCHIVES=()
          shopt -s nullglob
          for artifact_dir in artifacts/*/; do
            for file in "${artifact_dir}"*.tar.gz "${artifact_dir}"*.7z "${artifact_dir}"*.AppImage "${artifact_dir}"*.dmg "${artifact_dir}"*.app.zip; do
              if [ -f "$file" ]; then
                ARCHIVES+=("$file")
              fi
            done
          done
          
          if [ ${#ARCHIVES[@]} -eq 0 ]; then
            echo "ERROR: No archives found!"
            find artifacts -type f | head -20
            exit 1
          fi
          
          # Create release body.
          # Static text goes through quoted heredocs; dynamic values (commit message, author, changes list) come from env vars and are written with printf '%s', so nothing from a commit message is ever evaluated by the shell.
          {
            cat << 'HEADEREOF'
          # 🌙 Qmmp Nightly Build
          
          > **⚠️ Warning:** This is an automated nightly build from the `master` branch.
          > It may contain bugs, incomplete features, or breaking changes.
          > **Use at your own risk!** For stable releases, visit the [Releases](https://github.com/qmmp-dev/qmmp/releases) page.
          
          ---
          
          ## 📋 Build Information
          
          | Property | Value |
          |----------|-------|
          HEADEREOF
            printf '| **Build Date** | %s |\n' "$BUILD_DATE"
            printf '| **Commit SHA** | `%s` |\n' "$SHORT_SHA"
            printf '| **Full SHA** | `%s` |\n' "$COMMIT_SHA"
            printf '| **Last Commit** | %s |\n' "$COMMIT_MESSAGE"
            printf '| **Author** | %s |\n' "$COMMIT_AUTHOR"
            printf '| **Commit Date** | %s |\n' "$COMMIT_DATE"
            printf '| **Commits Since Last** | %s |\n' "$COMMITS_COUNT"
            cat << 'MIDEOF'
          
          ---
          
          ## 📦 Downloads
          
          ### 🐧 Linux
          
          | Format | File | Description |
          |--------|------|-------------|
          | **Binary** | `qmmp-*-linux-x86_64-binary.tar.gz` | Pre-built binaries for installation to `/usr` |
          | **AppImage** | `qmmp-*-linux-x86_64.AppImage` | Portable, no installation required |
          
          ### 🍎 macOS
          
          | Architecture | File |
          |--------------|------|
          | Apple Silicon (ARM64) | `qmmp-*-macos-arm64.app.zip` |
          
          ### 🪟 Windows
          
          | Architecture | File | Notes |
          |--------------|------|-------|
          | x86_64 | `qmmp-*-windows-x86_64.7z` | Self-contained (built with MSYS2 UCRT64) |          
          ---
          
          MIDEOF
            printf '%s\n' "$CHANGES_CONTENT"
            cat << 'FOOTEREOF'
          
          ---
          
          ## 🔧 Included Features
          
          ### Decoders
          MP3 (MAD/MPG123) • FLAC • OGG Vorbis • Musepack • WavPack • AAC/FAAD • Opus • XMP • Game Music Emu • SID • FFmpeg • sndfile • WildMidi • CUE
          
          ### Output Plugins
          ALSA • PipeWire • PulseAudio • Qt Multimedia • WASAPI • DirectSound • WaveOut • Null
          
          ### Effects
          Sample Rate Converter (SoX) • BS2B • LADSPA • Crossfade • Stereo Tools • Mono to Stereo
          
          ### Visualization
          Analyzer • projectM
          
          ### General Plugins
          MPRIS2 • Scrobbler • ListenBrainz • System Tray • Notifications • Lyrics • Hotkeys • Cover Art • ReplayGain • Tag Editor • And more...
          
          ### User Interfaces
          Skinned UI (classic Winamp-style; default) • Simple UI
          
          ---
          
          ## 📥 Installation
          
          ### Linux - Binary Tarball
          ```bash
          tar -xzf qmmp-*-linux-x86_64-binary.tar.gz
          sudo cp -r usr / && sudo cp -r etc / 2>/dev/null || true
          sudo ldconfig
          ```
          
          ### Linux - AppImage
          ```bash
          chmod +x qmmp-*-linux-x86_64.AppImage
          ./qmmp-*-linux-x86_64.AppImage
          ```
          
          ### macOS
          The app is ad-hoc signed but **not notarized**, so Gatekeeper blocks it on first launch
          if it was downloaded with a browser.
          
          **Downloaded in a browser (and unzipped by double-clicking):**
          1. Unzip `qmmp-*-macos-arm64.app.zip`
          2. Either right-click `Qmmp.app` → Open → Open, or, if that option isn't offered
             (on recent macOS (Sequoia/Tahoe) the right-click override is less consistently available),
             go to System Settings → Privacy & Security → scroll down → click Open Anyway
          3. Alternatively, remove the quarantine flag in a terminal and open the app:
          ```bash
          xattr -dr com.apple.quarantine Qmmp.app
          open Qmmp.app
          ```
          
          **Downloaded via terminal (no Gatekeeper prompt):**
          ```bash
          curl -L -o qmmp.zip "<URL of the qmmp-*-macos-arm64.app.zip asset>"
          unzip qmmp.zip
          open Qmmp.app
          ```
          
          ### Windows
          1. Extract `qmmp-*-windows-x86_64.7z` to a folder (7-Zip, or Windows 11's built-in extractor)
          2. Run `bin\qmmp.exe`
          
          The executable is not code-signed, so SmartScreen may show "Windows protected your PC": click More info → Run anyway.
          
          ---
          
          ## 🔗 Links
          
          [Website](http://qmmp.ylsoftware.com/) • [Source](https://github.com/qmmp-dev/qmmp) • [Issues](https://github.com/qmmp-dev/qmmp/issues) • [Wiki](https://github.com/qmmp-dev/qmmp/wiki) • [Stable Releases](https://github.com/qmmp-dev/qmmp/releases)
          
          ---
          
          FOOTEREOF
            printf '*🤖 Auto-generated by [GitHub Actions](%s) on %s*\n' "$RUN_URL" "$BUILD_DATE"
          } > release_body.md
          
          # Create the release
          gh release create nightly \
            --title "🌙 Nightly Build - ${BUILD_DATE}" \
            --notes-file release_body.md \
            --prerelease \
            "${ARCHIVES[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DATE: ${{ needs.check-for-updates.outputs.build_date }}
          SHORT_SHA: ${{ needs.check-for-updates.outputs.short_sha }}
          COMMIT_SHA: ${{ needs.check-for-updates.outputs.commit_sha }}
          COMMIT_MESSAGE: ${{ needs.check-for-updates.outputs.commit_message }}
          COMMIT_AUTHOR: ${{ needs.check-for-updates.outputs.commit_author }}
          COMMIT_DATE: ${{ needs.check-for-updates.outputs.commit_date }}
          COMMITS_COUNT: ${{ needs.check-for-updates.outputs.commits_count }}
          CHANGES_CONTENT: ${{ steps.changes.outputs.changes_content }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Verify release
        run: |
          echo "=== Release Created Successfully ==="
          gh release view nightly --json tagName,name,assets --jq '{tag: .tagName, name: .name, assets: [.assets[] | {name: .name, size: (.size / 1048576 | floor | tostring + " MB")}]}'
          echo "====================================="
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}