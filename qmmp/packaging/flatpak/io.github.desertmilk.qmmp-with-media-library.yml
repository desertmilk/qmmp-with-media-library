app-id: io.github.desertmilk.qmmp-with-media-library
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: qmmp
finish-args:
  - --socket=pulseaudio
  - --socket=session-bus
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=xdg-music:ro
  - --own-name=org.mpris.MediaPlayer2.qmmp
rename-desktop-file: qmmp.desktop
rename-icon: qmmp
rename-appdata-file: com.ylsoftware.qmmp.metainfo.xml
modules:
  - name: taglib
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_BINDINGS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://taglib.org/releases/taglib-2.3.2.tar.gz
        sha256: 3ca2d8afaa7f1cf7f6ed10e511ebc368bfacd6dcaa3dbfa690b89e502e8963dc

  - name: mpg123
    buildsystem: autotools
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/mpg123/mpg123/1.33.3/mpg123-1.33.3.tar.bz2
        sha256: 6a0c6472dd156e213c2068f40115ebbb73978c2d873e66bae2a250e2d2198d26

  - name: faad2
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      - type: archive
        url: https://github.com/knik0/faad2/archive/refs/tags/2.11.1.tar.gz
        sha256: 72dbc0494de9ee38d240f670eccf2b10ef715fd0508c305532ca3def3225bb06

  - name: qmmp
    buildsystem: cmake-ninja
    config-opts:
      - -DQMMP_DEFAULT_UI=skinned
      - -DUSE_MAD=OFF
      - -DUSE_MPG123=ON
      - -DUSE_AAC=ON
      - -DUSE_FLAC=ON
      - -DUSE_VORBIS=ON
      - -DUSE_OPUS=ON
      - -DUSE_CDA=OFF
      - -DUSE_FFMPEG=OFF
      - -DUSE_MPC=OFF
      - -DUSE_SNDFILE=OFF
      - -DUSE_WAVPACK=OFF
      - -DUSE_XMP=OFF
      - -DUSE_MIDI=OFF
      - -DUSE_GME=OFF
      - -DUSE_SID=OFF
      - -DUSE_ARCHIVE=OFF
      - -DUSE_ALSA=OFF
      - -DUSE_JACK=OFF
      - -DUSE_PIPEWIRE=OFF
      - -DUSE_QTMULTIMEDIA=OFF
      - -DUSE_PROJECTM=OFF
      - -DUSE_PULSE=ON
      - -DUSE_LIBCDDB=OFF
    post-install:
      - |
        for metainfo in \
          /app/share/metainfo/com.ylsoftware.qmmp.metainfo.xml \
          /app/share/metainfo/io.github.desertmilk.qmmp-with-media-library.metainfo.xml; do
          if [ -f "$metainfo" ]; then
            sed -i \
              -e 's/com\.ylsoftware\.qmmp/io.github.desertmilk.qmmp-with-media-library/g' \
              -e 's/qmmp\.desktop/io.github.desertmilk.qmmp-with-media-library.desktop/g' \
              "$metainfo"
          fi
        done
    sources:
      - type: dir
        path: ../..
